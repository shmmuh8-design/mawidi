<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>موعدي</title>
<meta name="description" content="احجز موعدك في الحلاق والصالون والعيادة والورشة في عُمان بضغطة.">
<meta name="theme-color" content="#2a1f7a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="موعدي">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-512.png">
<link rel="icon" href="icons/icon-512.png">
<style>
@font-face{font-family:"FCairo";src:url(fonts/cairo-600.woff) format("woff");font-weight:400 600;font-display:swap}
@font-face{font-family:"FCairo";src:url(fonts/cairo-800.woff) format("woff");font-weight:700 900;font-display:swap}
:root{--bg:#f4f2fb;--surface:#fff;--fg:#1d1640;--muted:#6c6890;--line:#e5e1f3;--acc:#5b3df5;--acc2:#8b5cf6;--ok:#16a06a;--red:#d6344a;--shadow:0 8px 26px rgba(50,30,140,.09)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0c22;--surface:#1a1636;--fg:#efeaff;--muted:#a59fcc;--line:#2c2652;--acc:#8a72ff;--acc2:#b08cff;--shadow:none;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--fg);font:500 17px/1.6 "FCairo",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
#app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{margin:0;font-weight:900;line-height:1.35}
/* 3D icons */
.i3d{--a:#7b61ff;--b:#3b1fc2;position:relative;display:inline-grid;place-items:center;width:62px;height:62px;border-radius:20px;flex:0 0 auto;
  background:radial-gradient(120% 90% at 30% 15%,color-mix(in srgb,var(--a) 70%,#fff) 0%,var(--a) 38%,var(--b) 100%);
  box-shadow:inset 0 -6px 12px rgba(0,0,0,.28),inset 0 5px 10px rgba(255,255,255,.45),0 10px 18px color-mix(in srgb,var(--b) 45%,transparent),0 2px 0 rgba(0,0,0,.12)}
.i3d::before{content:"";position:absolute;left:12%;right:12%;top:6%;height:40%;border-radius:50%/60% 60% 40% 40%;background:linear-gradient(180deg,rgba(255,255,255,.6),rgba(255,255,255,0))}
.i3d span{position:relative;font-size:30px;filter:drop-shadow(0 3px 3px rgba(0,0,0,.3))}
.i3d.md{width:52px;height:52px;border-radius:17px}.i3d.md span{font-size:25px}
.i3d.lg{width:76px;height:76px;border-radius:24px}.i3d.lg span{font-size:38px}
.e3d{display:inline-block;font-size:54px;filter:drop-shadow(0 8px 10px rgba(60,30,160,.3));margin-bottom:6px}.e3d.sm{font-size:26px;margin:0}
.logo3d{display:inline-grid;place-items:center;width:58px;height:58px;border-radius:19px;background:radial-gradient(120% 90% at 30% 15%,#fff 0%,#ffd76a 30%,#f39a1e 100%);box-shadow:inset 0 -6px 12px rgba(0,0,0,.22),inset 0 5px 10px rgba(255,255,255,.6),0 10px 20px rgba(0,0,0,.25)}
.logo3d span{font-size:30px;filter:drop-shadow(0 3px 3px rgba(0,0,0,.25))}
/* hero */
.hero{margin:0 -16px 18px;padding:calc(env(safe-area-inset-top,0px) + 18px) 18px 20px;margin-top:calc(-12px - env(safe-area-inset-top,0px));border-radius:0 0 28px 28px;color:#fff;
  background:radial-gradient(120% 120% at 90% 0%,#9b6bff 0%,#5b3df5 45%,#2a1f7a 100%);box-shadow:0 14px 34px rgba(60,30,180,.3)}
.brand{display:flex;align-items:center;gap:12px}.brand h1{font-size:30px}.brand small{opacity:.85;font-size:15px}
.where{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.where select{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:14px;padding:11px 12px;font-weight:700;-webkit-appearance:none;appearance:none}
.where option{color:#000}
.sec-h{font-size:18px;margin:18px 2px 10px}
.row-h{display:flex;align-items:center;justify-content:space-between}
.cats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px 6px}
@media (max-width:400px){.cats{grid-template-columns:repeat(4,1fr)}}
.cat{border:0;background:none;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .15s}
.cat b{font-size:13.5px;font-weight:700;text-align:center;line-height:1.3}
.cat:active{transform:scale(.94)} .cat.on .i3d{outline:3px solid var(--acc);outline-offset:3px}
.bcard{width:100%;display:flex;align-items:center;gap:12px;text-align:right;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:12px;margin-bottom:10px;box-shadow:var(--shadow)}
.bc-t{flex:1;min-width:0}.bc-t b{display:block;font-size:17px}.bc-t small{display:block;color:var(--muted);font-size:14px;line-height:1.5}
.go{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;font-weight:800;font-size:14px;padding:8px 12px;border-radius:12px;white-space:nowrap}
.empty{text-align:center;color:var(--muted);padding:26px 12px;background:var(--surface);border:1px dashed var(--line);border-radius:20px}.empty b{display:block;color:var(--fg);font-size:17px}
.sk{height:76px;border-radius:20px;background:linear-gradient(90deg,var(--surface),var(--line),var(--surface));background-size:200% 100%;animation:sk 1.2s infinite;margin-bottom:10px}
@keyframes sk{to{background-position:-200% 0}}
.link{border:0;background:none;color:var(--acc);font-weight:800;padding:6px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.back{border:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:7px 14px;font-weight:800}
.bhead{display:flex;align-items:center;gap:14px;padding:18px;border-radius:24px;color:#fff;background:radial-gradient(120% 120% at 90% 0%,color-mix(in srgb,var(--a) 75%,#fff),var(--a) 40%,var(--b));box-shadow:0 12px 28px color-mix(in srgb,var(--b) 40%,transparent)}
.bhead h1{font-size:23px}.bhead small{opacity:.92;font-size:14.5px}.bhead .i3d{box-shadow:inset 0 -6px 12px rgba(0,0,0,.28),inset 0 5px 10px rgba(255,255,255,.45),0 8px 16px rgba(0,0,0,.25)}
.about{color:var(--muted);margin:12px 4px 0}
.acts{display:flex;gap:8px;margin-top:12px}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;border:0;border-radius:16px;padding:14px;font-weight:800;font-size:17px;color:#fff;background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 8px 20px rgba(91,61,245,.28);margin-top:8px}
.btn:disabled{opacity:.6}
.btn.ghost{background:var(--surface);color:var(--fg);border:1px solid var(--line);box-shadow:none}
.btn.sm{width:auto;padding:8px 12px;font-size:14.5px;border-radius:12px;margin:0}
.btn.red,.red{color:var(--red)!important}
.svcs{display:flex;flex-wrap:wrap;gap:8px}
.svc{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 12px;text-align:center}.svc b{display:block;font-size:15px}.svc small{color:var(--muted);font-size:13px}
.svc.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--surface))}
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;width:66px;border:1.5px solid var(--line);background:var(--surface);border-radius:18px;padding:8px 4px;display:flex;flex-direction:column;align-items:center}
.day b{font-size:21px;line-height:1.2}.day small{font-size:12px;color:var(--muted)}
.day.on{background:linear-gradient(160deg,var(--acc2),var(--acc));border-color:transparent;color:#fff;box-shadow:0 8px 18px rgba(91,61,245,.3)}.day.on small{color:rgba(255,255,255,.85)}
.day.off{opacity:.45}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:380px){.slots{grid-template-columns:repeat(3,1fr)}}
.slot{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 2px;font-weight:800;font-size:15px;direction:rtl}
.slot small{display:block;font-size:11px;color:var(--muted);font-weight:600}
.slot:disabled{opacity:.45;text-decoration:line-through}
.slot.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.slots .sk,.slots .empty{grid-column:1/-1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;margin:14px 0;box-shadow:var(--shadow)}
.form label{display:block;font-weight:700;font-size:15px;margin-top:10px;color:var(--muted)}
.form input,.form select,.form textarea{display:block;width:100%;margin-top:5px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);border-radius:14px;padding:12px;font-size:17px;font-weight:600}
.form h3{margin:16px 0 6px;font-size:16px}
.form .sum{background:var(--bg);border-radius:12px;padding:10px;margin:8px 0 0;font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.done{text-align:center}.done .code{background:var(--bg);border-radius:12px;padding:10px;font-size:16px}
.rep{display:block;margin:18px auto 0;color:var(--muted)}
.ptitle{display:flex;align-items:center;justify-content:space-between;margin:6px 0 14px}.ptitle h1{font-size:26px}.ptitle small{color:var(--muted);font-weight:700}
.bk{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start}
.bk-t b{display:block;font-size:17px}.bk-t small{display:block;color:var(--muted);font-size:14px}
.bk-a{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.st{font-size:12.5px;font-weight:800;padding:3px 10px;border-radius:999px;white-space:nowrap}
.st.ok{background:color-mix(in srgb,var(--acc) 14%,transparent);color:var(--acc)}.st.done{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}.st.x{background:color-mix(in srgb,var(--red) 13%,transparent);color:var(--red)}
.plan{display:flex;justify-content:space-between;align-items:center;gap:8px;background:linear-gradient(135deg,#efe9ff,#e0f2ff);color:#2a1f7a;border-radius:16px;padding:12px 14px;font-weight:800;font-size:15px;margin-bottom:10px}
.plan a{background:#2a1f7a;color:#fff;border-radius:10px;padding:6px 12px;white-space:nowrap}
.plan.warn{background:linear-gradient(135deg,#ffe9e2,#fff3d6);color:#8a2a12}.plan.warn a{background:#8a2a12}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:4px;margin-bottom:12px}
.seg button{border:0;background:none;border-radius:12px;padding:10px;font-weight:800}.seg button.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 4px;text-align:center}.stats b{display:block;font-size:22px;color:var(--acc)}.stats small{font-size:12.5px;color:var(--muted)}
.ob-t{display:flex;justify-content:space-between;align-items:center}.ob-t b{font-size:19px}
.ob-n{font-weight:700;margin-top:4px}.ob-n small{display:block;color:var(--muted);text-align:right}
.ob.cancelled,.ob.noshow{opacity:.6}
.dchips{display:flex;flex-wrap:wrap;gap:6px}
.dch{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:7px 11px;font-weight:700;font-size:14.5px}.dch.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.svrow{display:grid;grid-template-columns:1fr 92px 38px;gap:6px;margin-top:6px}.svrow input{margin:0!important}
.svrow button{border:0;background:var(--bg);border-radius:12px;color:var(--red);font-weight:800}
.sw{display:flex!important;align-items:center;gap:10px;margin-top:16px!important;color:var(--fg)!important}.sw input{width:22px!important;height:22px;margin:0!important}
.pitch{display:grid;gap:8px;margin-bottom:6px}.pitch div{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px;font-weight:700}
.fine{color:var(--muted);font-size:13.5px;text-align:center}
#nav{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;justify-content:center;padding:8px 12px calc(10px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
#nav div{display:grid;grid-template-columns:repeat(3,1fr);width:100%;max-width:520px}
#nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:800;font-size:13px;color:var(--muted);padding:4px}
#nav button span{font-size:24px;filter:grayscale(1) opacity(.6);transition:.2s}
#nav button[aria-current="true"]{color:var(--acc)}#nav button[aria-current="true"] span{filter:none;transform:translateY(-2px) scale(1.12)}
.sos{margin-inline-start:auto;align-self:flex-start;white-space:nowrap;flex-shrink:0;border:0;border-radius:999px;padding:8px 14px;font:800 15px "FCairo",sans-serif;color:#fff;background:linear-gradient(180deg,#ff5a6e,#d6213b);box-shadow:0 6px 16px rgba(214,33,59,.45),inset 0 2px 0 rgba(255,255,255,.35)}
.sosbg{position:fixed;inset:0;background:rgba(10,6,30,.6);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sosbox{background:var(--surface);color:var(--fg);width:100%;max-width:520px;border-radius:26px 26px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom,0px));text-align:center}
.sosbox h2{margin:4px 0 4px;font-size:22px}.sosbox p{color:var(--muted);margin:0 0 14px;font-size:15px}
.sosbox a,.sosbox button{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:10px;border:0;border-radius:18px;padding:15px;font:800 18px "FCairo",sans-serif;text-decoration:none}
.sos-call{color:#fff;background:linear-gradient(180deg,#ff5a6e,#d6213b);font-size:22px!important}
.sos-loc{color:#fff;background:linear-gradient(180deg,#2fd27a,#16a06a)}
.sos-x{background:var(--bg)!important;color:var(--fg)}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:#1d1640;color:#fff;padding:10px 18px;border-radius:14px;font-weight:700;transition:.25s;z-index:50;pointer-events:none;max-width:90%;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.foot{text-align:center;color:var(--muted);font-size:13px;margin-top:26px}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav"><div>
  <button data-v="home"><span>🏠</span>احجز</button>
  <button data-v="mine"><span>🗓️</span>حجوزاتي</button>
  <button data-v="own"><span>🏪</span>لصاحب المحل</button>
</div></nav>
<div id="toast" role="status"></div>
<script src="config.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
